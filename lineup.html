<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWPL - Match Lineup</title>
  <link rel="stylesheet" href="lineup.css">
</head>

<body>

  <div class="lineup-page">

    <!-- MATCH HEADER -->
    <div class="match-header">

      <div class="team">
        <div class="team-logo">⚽</div>
        <h2 id="homeTeam">Home Team</h2>
      </div>

      <div class="match-info">
        <span>LWPL</span>
        <strong>VS</strong>
        <small id="matchDate">Match Lineup</small>
      </div>

      <div class="team">
        <div class="team-logo">⚽</div>
        <h2 id="awayTeam">Away Team</h2>
      </div>

    </div>


    <!-- FORMATION -->
    <div class="formation-bar">
      <span>FORMATION</span>
      <strong>4 - 3 - 3</strong>
    </div>


    <!-- PITCH -->
    <div class="pitch-wrapper">

      <div class="pitch">

        <div class="center-line"></div>
        <div class="center-circle"></div>
        <div class="center-dot"></div>

        <div class="penalty-box top-box"></div>
        <div class="goal-box top-goal-box"></div>
        <div class="goal top-goal"></div>

        <div class="penalty-box bottom-box"></div>
        <div class="goal-box bottom-goal-box"></div>
        <div class="goal bottom-goal"></div>

        <!-- HOME PLAYERS -->
        <div id="homeLineup" class="players-layer"></div>

      </div>

    </div>


    <!-- AWAY TEAM -->
    <div class="away-section">

      <h2 id="awayTitle">Away Team</h2>

      <div id="awayLineup" class="away-players"></div>

    </div>


    <!-- SUBSTITUTES -->
    <div class="substitutes">

      <h2>SUBSTITUTES</h2>

      <div id="substitutesList" class="sub-list">
        Loading players...
      </div>

    </div>

  </div>

  <script type="module" src="lineup.js"></script>

</body>
</html>
