<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Match Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 25px;
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚽ Enter Match Result</h1>

    <label for="homeTeam">Home Team</label>
    <select id="homeTeam">
      <option value="">Select Home Team</option>
    </select>

    <label for="homeGoals">Home Goals</label>
    <input type="number" id="homeGoals" min="0" placeholder="Enter goals">

    <label for="awayTeam">Away Team</label>
    <select id="awayTeam">
      <option value="">Select Away Team</option>
    </select>

    <label for="awayGoals">Away Goals</label>
    <input type="number" id="awayGoals" min="0" placeholder="Enter goals">

    <button id="saveResult">Save Result</button>

  </div>

  <script type="module" src="results.js"></script>

</body>
                                           </html>
