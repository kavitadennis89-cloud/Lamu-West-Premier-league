<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lamu West Premier League</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <!-- ========================== -->
  <!-- HEADER -->
  <!-- ========================== -->

  <header>

    <h1>
      🏆 Lamu West Premier League
    </h1>

    <p>
      Official League Website
    </p>

  </header>


  <!-- ========================== -->
  <!-- NAVIGATION -->
  <!-- ========================== -->

  <nav style="
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:15px;
    margin-bottom:20px;
  ">

    <a href="index.html">
      🏠 Home
    </a>

    <a href="#standings">
      🏆 Standings
    </a>

    <a href="#upcomingFixtures">
      📅 Fixtures
    </a>

    <a href="#latestResults">
      ⚽ Results
    </a>

    <a href="#topScorers">
      🥇 Top Scorers
    </a>

  </nav>


  <!-- ========================== -->
  <!-- LEAGUE TABLE -->
  <!-- ========================== -->

  <section id="standings">

    <h2>
      League Standings
    </h2>

    <table>

      <tr>

        <th>Pos</th>
        <th>Club</th>
        <th>P</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>GF</th>
        <th>GA</th>
        <th>GD</th>
        <th>Pts</th>

      </tr>

    </table>

  </section>


  <!-- ========================== -->
  <!-- UPCOMING FIXTURES -->
  <!-- ========================== -->

  <section id="upcomingFixtures">

    <h2>
      📅 Upcoming Fixtures
    </h2>

  </section>


  <!-- ========================== -->
  <!-- MATCH RESULTS -->
  <!-- ========================== -->

  <section id="latestResults">

    <h2>
      ⚽ Match Results
    </h2>

    <div id="resultsList">

      <p>
        Loading results...
      </p>

    </div>

  </section>


  <!-- ========================== -->
  <!-- TOP SCORERS -->
  <!-- ========================== -->

  <section id="topScorers">

    <h2>
      🥇 Top Scorers
    </h2>

    <div id="scorersList">

      <p>
        Loading top scorers...
      </p>

    </div>

  </section>


  <!-- ========================== -->
  <!-- JAVASCRIPT -->
  <!-- ========================== -->

  <script
    type="module"
    src="script.js?v=12">
  </script>


</body>

  </html>
