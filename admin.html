<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lamu West Premier League - Admin</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <h1>
    Lamu West Premier League - Admin Panel
  </h1>


  <div id="adminError"></div>


  <!-- =====================================
       ADD TEAM
  ====================================== -->

  <h2>⚽ Add Team</h2>

  <form id="teamForm">

    <input
      type="text"
      id="name"
      placeholder="Team Name"
      required
    >

    <input
      type="number"
      id="played"
      placeholder="Played"
      required
    >

    <input
      type="number"
      id="wins"
      placeholder="Wins"
      required
    >

    <input
      type="number"
      id="draws"
      placeholder="Draws"
      required
    >

    <input
      type="number"
      id="losses"
      placeholder="Losses"
      required
    >

    <input
      type="number"
      id="goalsFor"
      placeholder="Goals For"
      required
    >

    <input
      type="number"
      id="goalsAgainst"
      placeholder="Goals Against"
      required
    >

    <input
      type="number"
      id="points"
      placeholder="Points"
      required
    >

    <button type="submit">
      Save Team
    </button>

  </form>


  <hr>


  <!-- =====================================
       TEAMS
  ====================================== -->

  <h2>⚽ Teams</h2>

  <div id="teamsList">

    <p>
      Loading teams...
    </p>

  </div>


  <hr>


  <!-- =====================================
       ADD PLAYER
  ====================================== -->

  <h2>👤 Add Player</h2>

  <form id="playerForm">

    <input
      type="text"
      id="playerNameAdmin"
      placeholder="Player Name"
      required
    >

    <label>
      Team
    </label>

    <select
      id="playerTeam"
      required
    >

      <option value="">
        Select Team
      </option>

    </select>


    <input
      type="number"
      id="playerNumber"
      placeholder="Jersey Number"
      min="1"
      max="99"
      required
    >


    <label>
      Position
    </label>

    <select
      id="playerPosition"
      required
    >

      <option value="">
        Select Position
      </option>

      <option value="GK">
        GK - Goalkeeper
      </option>

      <option value="DEF">
        DEF - Defender
      </option>

      <option value="MID">
        MID - Midfielder
      </option>

      <option value="FWD">
        FWD - Forward
      </option>

    </select>


    <label>

      <input
        type="checkbox"
        id="playerStarting"
      >

      Starting XI

    </label>


    <label>

      <input
        type="checkbox"
        id="playerCaptain"
      >

      Captain ⭐

    </label>


    <button type="submit">
      Save Player
    </button>

  </form>


  <h2>👥 Players</h2>

  <div id="playersList">

    <p>
      Loading players...
    </p>

  </div>


  <hr>


  <!-- =====================================
       ADD FIXTURE
  ====================================== -->

  <h2>📅 Add Fixture</h2>

  <form id="fixtureForm">

    <label>
      Home Team
    </label>

    <select
      id="fixtureHome"
      required
    >

      <option value="">
        Select Home Team
      </option>

    </select>


    <label>
      Away Team
    </label>

    <select
      id="fixtureAway"
      required
    >

      <option value="">
        Select Away Team
      </option>

    </select>


    <label>
      Match Date
    </label>

    <input
      type="date"
      id="fixtureDate"
      required
    >


    <button type="submit">
      Save Fixture
    </button>

  </form>


  <hr>


  <!-- =====================================
       FIXTURES
  ====================================== -->

  <h2>📅 Fixtures</h2>

  <div id="fixturesList">

    <p>
      Loading fixtures...
    </p>

  </div>


  <hr>


  <!-- =====================================
       ADD TOP SCORER
  ====================================== -->

  <h2>🥇 Add Top Scorer</h2>

  <form id="scorerForm">

    <input
      type="text"
      id="playerName"
      placeholder="Player Name"
      required
    >


    <label>
      Team
    </label>

    <select
      id="scorerTeam"
      required
    >

      <option value="">
        Select Team
      </option>

    </select>


    <input
      type="number"
      id="playerGoals"
      placeholder="Goals"
      min="0"
      required
    >


    <button type="submit">
      Save Top Scorer
    </button>

  </form>


  <h2>🥇 Top Scorers</h2>

  <div id="scorersList">

    <p>
      Loading scorers...
    </p>

  </div>


  <!-- =====================================
       ADMIN JAVASCRIPT
  ====================================== -->

  <script>
  document.getElementById("adminError").innerHTML =
    "<div style='padding:15px;background:yellow;'>JAVASCRIPT INAFANYA KAZI</div>";
</script>

<script type="module" src="admin.js?v=3"></script>


</body>

</html>
