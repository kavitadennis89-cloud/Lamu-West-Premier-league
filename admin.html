<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lamu West Premier League - Admin Panel</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="sidebar">

        <div class="logo">
            <h2>🏆 LWPL</h2>
            <p>Admin Panel</p>
        </div>

        <ul>

            <li class="active" data-page="dashboard">
                📊 Dashboard
            </li>

            <li data-page="teams">
                ⚽ Teams
            </li>

            <li data-page="players">
                👕 Players
            </li>

            <li data-page="fixtures">
                📅 Fixtures
            </li>

            <li data-page="results">
                🥅 Results
            </li>

            <li data-page="scorers">
                ⚽ Top Scorers
            </li>

            <li data-page="logos">

            <li data-page="lineups">
                📋 Lineups
            </li>

            <li data-page="settings">
                ⚙️ Settings
            </li>

        </ul>

    </div>


    <div class="main">

        <header>

            <h2 id="pageTitle">
                Dashboard
            </h2>

        </header>


        <div id="content">

            <div class="card">

                <h3>
                    🏆 Lamu West Premier League
                </h3>

                    Welcome to the Admin Panel.
