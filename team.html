<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Team Profile - Lamu West Premier League</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f5f3;
      color: #17221f;
    }

    .team-header {
      background: linear-gradient(
        135deg,
        #064d32,
        #087f50
      );

      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .team-header h1 {
      margin: 0;
      font-size: 32px;
    }

    .team-header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    main {
      width: 95%;
      max-width: 1000px;
      margin: 25px auto;
    }

    #teamName {
      background: white;
      color: #075e3d;
      text-align: center;
      padding: 25px 15px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    section {
      background: white;
      padding: 22px;
      margin-bottom: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    section h3 {
      color: #075e3d;
      margin-top: 0;
      border-bottom: 2px solid #075e3d;
      padding-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #075e3d;
      color: white;
      padding: 13px 8px;
    }

    td {
      padding: 13px 8px;
      text-align: center;
      border-bottom: 1px solid #e2e7e4;
      font-weight: bold;
    }

    /* =========================
       PLAYER CARDS
    ========================= */

    .players-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .player-card {
      background: #f7faf8;
      border: 1px solid #e1e8e4;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .player-card:hover {
      transform: translateY(-4px);
    }

    .player-number-big {
      width: 55px;
      height: 55px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: #075e3d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .player-card h4 {
      margin: 8px 0;
      color: #075e3d;
      font-size: 18px;
    }

    .player-position {
      color: #555;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .player-status {
      font-size: 13px;
      line-height: 1.6;
    }

    .captain-badge {
      color: #b8860b;
      font-weight: bold;
    }

    .starting-badge {
      color: #075e3d;
      font-weight: bold;
    }

    .substitute-badge {
      color: #666;
    }

    .no-players {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    /* =========================
       BACK BUTTON
    ========================= */

    .back-link {
      text-align: center;
      margin: 30px 0;
    }

    .back-link a {
      display: inline-block;
      background: #075e3d;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    .back-link a:hover {
      background: #043d28;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .players-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 450px) {

      .team-header h1 {
        font-size: 25px;
      }

      section {
        padding: 15px;
      }

      .players-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header class="team-header">

    <h1>
      🏆 Lamu West Premier League
    </h1>

    <p>
      Official Team Profile
    </p>

  </header>


  <main>


    <!-- TEAM NAME -->

    <h2 id="teamName">
      Loading team...
    </h2>


    <!-- TEAM STATISTICS -->

    <section>

      <h3>
        📊 Team Statistics
      </h3>

      <table>

        <tr>

          <th>Played</th>
          <th>Won</th>
          <th>Draw</th>
          <th>Lost</th>

        </tr>

        <tr>

          <td id="played">0</td>

          <td id="won">0</td>

          <td id="draw">0</td>

          <td id="lost">0</td>

        </tr>

      </table>

    </section>


    <!-- GOALS & POINTS -->

    <section>

      <h3>
        ⚽ Goals & Points
      </h3>

      <table>

        <tr>

          <th>GF</th>
          <th>GA</th>
          <th>GD</th>
          <th>Points</th>

        </tr>

        <tr>

          <td id="goalsFor">0</td>

          <td id="goalsAgainst">0</td>

          <td id="goalDifference">0</td>

          <td id="points">0</td>

        </tr>

      </table>

    </section>


    <!-- TEAM SQUAD -->

    <section>

      <h3>
        👥 Team Squad
      </h3>

      <div
        id="playersList"
        class="players-grid"
      >

        <p class="no-players">
          Loading players...
        </p>

      </div>

    </section>


    <!-- BACK -->

    <div class="back-link">

      <a href="index.html">
        ← Back to League
      </a>

    </div>


  </main>


  <script
    type="module"
    src="team.js?v=3"
  ></script>


</body>

</html>
