<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Squad - Lamu West Premier League</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #0b5d1e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        .team-header {
            background: white;
            margin: 20px auto;
            padding: 25px;
            max-width: 900px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .team-header h2 {
            margin: 5px 0;
            color: #0b5d1e;
            font-size: 28px;
        }

        .team-header p {
            color: #777;
        }

        .squad {
            max-width: 900px;
            margin: auto;
            padding: 0 15px 30px;
        }

        .section-title {
            margin-top: 25px;
            background: #0b5d1e;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 18px;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .player-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .number {
            background: #0b5d1e;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        .player-info h3 {
            margin: 0 0 5px;
            font-size: 17px;
        }

        .player-info p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .captain {
            color: #d89b00;
            font-weight: bold;
            font-size: 12px;
            margin-top: 5px !important;
        }

        .empty {
            background: white;
            padding: 20px;
            text-align: center;
            color: #777;
            border-radius: 10px;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Lamu West Premier League</h1>
</header>

<div class="team-header">
    <h2 id="teamName">Loading Team...</h2>
    <p>Official Team Squad</p>
</div>

<div class="squad">

    <div class="section-title">🧤 Goalkeepers</div>
    <div id="goalkeepers" class="players"></div>

    <div class="section-title">🛡️ Defenders</div>
    <div id="defenders" class="players"></div>

    <div class="section-title">⚽ Midfielders</div>
    <div id="midfielders" class="players"></div>

    <div class="section-title">🔥 Forwards</div>
    <div id="forwards" class="players"></div>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script type="module" src="team.js"></script>

</body>
</html>
