<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lamu West Premier League - Admin</title>

    <link rel="stylesheet" href="admin.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>🏆 LWPL</h2>

            <p>Admin Panel</p>

        </div>


        <ul>

            <li
                class="active"
                data-page="dashboard"
            >
                📊 Dashboard
            </li>

            <li data-page="teams">
                ⚽ Teams
            </li>

            <li data-page="players">
                👕 Players
            </li>

            <li data-page="fixtures">
                📅 Fixtures
            </li>

            <li data-page="results">
                🥅 Results
            </li>

            <li data-page="scorers">
                ⚽ Top Scorers
            </li>

            <li data-page="logos">
                🖼️ Team Logos
            </li>

            <li data-page="lineups">
                📋 Lineups
            </li>

            <li data-page="settings">
                ⚙️ Settings
            </li>

        </ul>

    </aside>



    <!-- MAIN CONTENT -->

    <main class="main">

        <header>

            <h2 id="pageTitle">
                Dashboard
            </h2>

        </header>


        <section id="content">

            <div class="card">

                <h3>
                    🏆 Lamu West Premier League
                </h3>

                <p>
                    Welcome to the Admin Panel.
                </p>

            </div>

        </section>

    </main>



    <!-- ONLY JAVASCRIPT -->

    <script
        type="module"
        src="./admin.js?v=10"
    ></script>


</body>

</html>
