<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lamu West Premier League - Admin</title>

<link rel="stylesheet" href="admin.css">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <h2>🏆 LWPL</h2>

        <p>Admin Panel</p>

    </div>


    <ul>

        <li
            class="active"
            data-page="dashboard"
        >
            📊 Dashboard
        </li>

        <li data-page="teams">
            ⚽ Teams
        </li>

        <li data-page="players">
            👕 Players
        </li>

        <li data-page="fixtures">
            📅 Fixtures
        </li>

        <li data-page="results">
            🥅 Results
        </li>

        <li data-page="scorers">
            ⚽ Top Scorers
        </li>

        <li data-page="logos">
            🖼️ Team Logos
        </li>

        <li data-page="lineups">
            📋 Lineups
        </li>

        <li data-page="settings">
            ⚙️ Settings
        </li>

    </ul>

</div>



<!-- MAIN -->

<div class="main">


    <header>

        <h2 id="pageTitle">
            Dashboard
        </h2>

    </header>


    <div id="content">

        <div class="card">

            <h3>
                🏆 LWPL Admin Dashboard
            </h3>

            <p>
                Welcome to Lamu West Premier League.
            </p>

        </div>

    </div>


</div>



<!-- IMPORTANT -->

<script
    type="module"
    src="./admin.js?v=2"
>
</script>


</body>
<script>
document.querySelectorAll(".sidebar li").forEach(item => {

    item.addEventListener("click", function() {

        document.getElementById("pageTitle").textContent =
            this.textContent.trim();

        document.getElementById("content").innerHTML = `
            <div class="card">
                <h3>${this.textContent.trim()}</h3>
                <p>✅ Menu is working!</p>
            </div>
        `;

    });

});
</script>
</html>
