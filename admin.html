<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lamu West Premier League - Admin</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Lamu West Premier League - Admin Panel</h1>


  <!-- ===================== -->
  <!-- ADD TEAM -->
  <!-- ===================== -->

  <form id="teamForm">

    <input type="text" id="name" placeholder="Team Name" required>

    <input type="number" id="played" placeholder="Played" required>

    <input type="number" id="wins" placeholder="Wins" required>

    <input type="number" id="draws" placeholder="Draws" required>

    <input type="number" id="losses" placeholder="Losses" required>

    <input type="number" id="goalsFor" placeholder="Goals For" required>

    <input type="number" id="goalsAgainst" placeholder="Goals Against" required>

    <input type="number" id="points" placeholder="Points" required>

    <button type="submit" id="saveFixture">
  Save Fixture
    </button>

  </form>


  <hr>


  <h2>Teams</h2>

  <div id="teamsList"></div>


  <hr>


  <!-- ===================== -->
  <!-- ADD FIXTURE -->
  <!-- ===================== -->

  <h2>📅 Add Fixture</h2>


  <form id="fixtureForm">

    <label>Home Team</label>

    <select id="fixtureHome" required>

      <option value="">
        Select Home Team
      </option>

    </select>


    <label>Away Team</label>

    <select id="fixtureAway" required>

      <option value="">
        Select Away Team
      </option>

    </select>


    <label>Match Date</label>

    <input
      type="date"
      id="fixtureDate"
      required
    >


    <button type="submit">
      Save Fixture
    </button>

  </form>


  <h2>📅 Fixtures</h2>

  <div id="fixturesList">
    <p>Loading fixtures...</p>
  </div>


  <script
    type="module"
    src="admin.js">
  </script>

</body>
</html>
