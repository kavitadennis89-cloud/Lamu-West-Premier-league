<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Team Profile - Lamu West Premier League</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <header>

    <h1>
      🏆 Lamu West Premier League
    </h1>

    <p>
      Team Profile
    </p>

  </header>


  <main>

    <h2 id="teamName">
      Loading team...
    </h2>


    <section>

      <h3>📊 Team Statistics</h3>

      <table>

        <tr>
          <th>Played</th>
          <th>Won</th>
          <th>Draw</th>
          <th>Lost</th>
        </tr>

        <tr>

          <td id="played">0</td>

          <td id="won">0</td>

          <td id="draw">0</td>

          <td id="lost">0</td>

        </tr>

      </table>

    </section>


    <section>

      <h3>⚽ Goals</h3>

      <table>

        <tr>
          <th>GF</th>
          <th>GA</th>
          <th>GD</th>
          <th>Points</th>
        </tr>

        <tr>

          <td id="goalsFor">0</td>

          <td id="goalsAgainst">0</td>

          <td id="goalDifference">0</td>

          <td id="points">0</td>

        </tr>

      </table>

    </section>


    <p>

      <a href="index.html">
        ← Back to League
      </a>

    </p>

  </main>


  <script
    type="module"
    src="team.js?v=1">
  </script>

</body>

</html>
