<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamu West Premier League - Admin Panel</title>

<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script type="module" src="admin.js" defer></script>

</head>

<body>

<div class="sidebar">

    <div class="logo">
        <h2>🏆 LWPL</h2>

    </div>

    <ul>

        </li>

        <li data-page="teams">
            ⚽ Teams
        </li>

        <li data-page="players">
            👕 Players
        </li>

        <li data-page="fixtures">

            🥅 Results
        </li>

        <li data-page="scorers">

        </li>

        <li data-page="logos">

        <li data-page="lineups">
            📋 Lineups
        </li>

        <li data-page="settings">
            ⚙ Settings
        </li>

    </ul>

</div>


<div class="main">

<header>

<h2 id="pageTitle">
Dashboard
</h2>

</header>

<div id="content">

<h3>Welcome Admin 👋</h3>

Manage the Lamu West Premier League from here.
</p>

</html>
