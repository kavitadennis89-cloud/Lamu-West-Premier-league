<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Squad | Lamu West Premier League</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #17221c;
        }

        header {
            background: linear-gradient(135deg, #087f3f, #043d25);
            color: white;
            padding: 28px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            opacity: 0.85;
            font-size: 14px;
        }

        .container {
            width: 94%;
            max-width: 1000px;
            margin: 25px auto 50px;
        }

        .team-header {
            background: white;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .team-header h2 {
            font-size: 30px;
            color: #087f3f;
            text-transform: uppercase;
        }

        .team-header span {
            display: block;
            margin-top: 7px;
            color: #777;
            font-size: 14px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section-title {
            background: #087f3f;
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .player-card {
            background: white;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            border-left: 5px solid #087f3f;
            transition: transform 0.2s ease;
        }

        .player-card:hover {
            transform: translateY(-3px);
        }

        .player-number {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #087f3f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .player-details h3 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .position {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .starting-badge,
        .sub-badge,
        .captain-badge {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
        }

        .starting-badge {
            background: #dff5e8;
            color: #087f3f;
        }

        .sub-badge {
            background: #eeeeee;
            color: #666;
        }

        .captain-badge {
            background: #fff1b8;
            color: #8a6800;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            color: #777;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #087f3f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #055c2d;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #043d25;
            color: white;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .team-header h2 {
                font-size: 24px;
            }

            .players {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>LAMU WEST PREMIER LEAGUE</h1>
    <p>Official Team Squad</p>
</header>

<div class="container">

    <div class="team-header">
        <h2 id="teamName">Team Squad</h2>
        <span>2026 Season • Official Squad</span>
    </div>

    <div class="section">
        <div class="section-title">🧤 Goalkeepers</div>
        <div id="goalkeepers" class="players"></div>
    </div>

    <div class="section">
        <div class="section-title">🛡️ Defenders</div>
        <div id="defenders" class="players"></div>
    </div>

    <div class="section">
        <div class="section-title">⚙️ Midfielders</div>
        <div id="midfielders" class="players"></div>
    </div>

    <div class="section">
        <div class="section-title">⚽ Forwards</div>
        <div id="forwards" class="players"></div>
    </div>

    <a href="index.html" class="back-btn">← Back to Home</a>

</div>

<footer>
    © 2026 Lamu West Premier League
</footer>

<script type="module" src="team.js"></script>

</body>
</html>
